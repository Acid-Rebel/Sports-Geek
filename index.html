    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        function submitForm(event) {
            event.preventDefault();
            const personalForm = document.getElementById('personalForm');
            const accountForm = document.getElementById('accountForm');
            const interestForm = document.getElementById('interestForm');
            const firstName = personalForm['firstName'].value.trim();
            const lastName = personalForm['lastName'].value.trim();
            const email = accountForm['email'].value.trim();

            if (!firstName || !lastName || !email) {
                alert("Please fill out all required fields.");
                return false;
            }

            if (!validateEmail(email)) {
                alert("Please enter a valid email address.");
                return false;
            }

            alert("Form submitted successfully!");
            personalForm.submit();
            accountForm.submit();
            interestForm.submit();
        }

        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        document.getElementById('country').addEventListener('change', function() {
            const selectedCountry = this.value;
            const stateSelect = document.getElementById('state');
            stateSelect.disabled = false; // Enable state dropdown on change

            // Clear existing state options
            stateSelect.innerHTML = "";

            // Add default "Select State" option
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.text = "Select State";
            stateSelect.add(defaultOption);

            // Add specific state options based on country (replace with your logic)
            if (selectedCountry === "US") {
                const states = ["California", "Texas", "New York"];
                for (const state of states) {
                    const option = document.createElement('option');
                    option.value = state;
                    option.text = state;
                    stateSelect.add(option);
                }
            } else if (selectedCountry === "CA") {
                const states = ["Ontario", "Quebec", "British Columbia"];
                for (const state of states) {
                    const option = document.createElement('option');
                    option.value = state;
                    option.text = state;
                    stateSelect.add(option);
                }
            }
            else if (selectedCountry === "UK") {
                const states = ["London", "scotland", "Whales"];
                for (const state of states) {
                    const option = document.createElement('option');
                    option.value = state;
                    option.text = state;
                    stateSelect.add(option);
                }
            }
            else if (selectedCountry === "FR") {
                const states = ["Paris", "Croissant", "wine"];
                for (const state of states) {
                    const option = document.createElement('option');
                    option.value = state;
                    option.text = state;
                    stateSelect.add(option);
                }
            }
            else if (selectedCountry === "DE") {
                const states = ["Berlin", "Frankfurt", "Dublin"];
                for (const state of states) {
                    const option = document.createElement('option');
                    option.value = state;
                    option.text = state;
                    stateSelect.add(option);
                }
            }
            else if (selectedCountry === "JP") {
                const states = ["Tokyo", "kyoto", "Hiroshima"];
                for (const state of states) {
                    const option = document.createElement('option');
                    option.value = state;
                    option.text = state;
                    stateSelect.add(option);
                }
            }
            else {
                // Disable state dropdown if no country is selected
                stateSelect.disabled = true;
            }
        });
    </script>
